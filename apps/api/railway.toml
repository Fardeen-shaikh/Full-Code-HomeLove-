[build]
builder = "nixpacks"
buildCommand = "npm install -g pnpm@10 && cd ../.. && pnpm install --frozen-lockfile && cd apps/api && npx payload generate:importmap && pnpm build"

[deploy]
startCommand = "pnpm start"
healthcheckPath = "/api/users"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[service]
rootDirectory = "apps/api"
