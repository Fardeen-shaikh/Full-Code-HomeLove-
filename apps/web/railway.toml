[build]
builder = "nixpacks"
buildCommand = "npm install -g pnpm@10 && cd ../.. && pnpm install --frozen-lockfile && cd apps/web && pnpm build"

[deploy]
startCommand = "pnpm start"
healthcheckPath = "/"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[service]
rootDirectory = "apps/web"
